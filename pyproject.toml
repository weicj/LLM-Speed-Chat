[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-speed-chat"
version = "0.1.0"
description = "A small OpenAI-compatible chat UI for measuring interactive LLM serving speed."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["llm", "benchmark", "throughput", "chat", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]
dependencies = []

[project.scripts]
llm-speed-chat = "llm_speed_chat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_speed_chat = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js", "static/vendor/*.md"]
