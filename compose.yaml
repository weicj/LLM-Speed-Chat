services:
  llm-speed-chat:
    build:
      context: .
    image: llm-speed-chat:local
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://host.docker.internal:8000}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      MODEL: ${MODEL:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-67108864}
      UPSTREAM_MODEL_TIMEOUT_S: ${UPSTREAM_MODEL_TIMEOUT_S:-20}
      UPSTREAM_CHAT_TIMEOUT_S: ${UPSTREAM_CHAT_TIMEOUT_S:-3600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
